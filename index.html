<!DOCTYPE html>
<html>
<head>
    <title>PORTFOLIO</title>
    <style>
        img {
            width: 300px;
            height: 400px; /* Forces portrait proportions */
            object-fit: cover; /* Prevents stretching */
            display: block;
            margin: 0 auto; /* Centers the image */
            border-radius: 12px; /* Smooth corners without turning oval */
        }

        .illustrations {
            font-weight: bold;
            text-align: center;
        }

        /* Hover interaction */
        img:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <img src="imagess/BLEu.png" alt="Blue Art">
    <p class="illustrations">@SUYEON.ARTS</p>
    <p style="text-align: center;">THIS IS BLUE</p>
</body>
</html>
